 {n:'중간배당 이사회의사록', d:'법인이 결산 전에 중간배당을 결정할 때 남기는 이사회 의사록이에요.', c:'법인·주식', f:'한글', s:'이사회 의사록 회의록 배당 중간배당 결의', id:'223668230086', dt:'2024-11-21'},
 {n:'급여명세서 (급여지급명세서)', d:'직원에게 월급 내역을 줄 때 쓰는 명세서. 임금명세서 교부 의무와 제출기한도 정리했어요.', c:'인사·노무', f:'한글', s:'급여명세서 임금명세서 월급명세서 급여지급명세서 지급명세서', id:'223093413081', dt:'2023-05-04'},
 {n:'대리인 위임장', d:'대표님 대신 직원·가족이 은행·관공서에 서류를 낼 때 쓰는 위임장이에요.', c:'세무·제출 서류', f:'한글', s:'위임장 대리인 위임 세무서 은행 관공서', id:'223071480268', dt:'2023-04-11'},

 {n:'보안 서약서', d:'입사자나 외주 인력에게 회사 정보를 지키겠다는 약속을 받을 때 써요.', c:'인사·노무', f:'한글', s:'보안서약서 비밀유지서약서 비밀유지 NDA 입사서류', id:'223044170862', dt:'2023-03-14'},
 {n:'선급금 포기각서', d:'미리 준 돈(선급금)을 돌려받지 않기로 정리할 때 쓰는 각서예요.', c:'회계·내부 문서', f:'한글', s:'포기각서 선급금 각서 채권포기', id:'223039653962', dt:'2023-03-11'},
 {n:'사용인감계', d:'법인 인감 대신 사용인감을 쓸 때 함께 제출하는 서류예요. 사용인감이 뭔지도 설명했어요.', c:'법인·주식', f:'한글', s:'사용인감계 사용인감 인감계 법인인감 도장', id:'223032447224', dt:'2023-03-05'},
 {n:'재직증명서', d:'직원이 대출·비자 등으로 재직 사실 증명을 요청할 때 발급해요.', c:'인사·노무', f:'한글', s:'재직증명서 재직증명 경력증명서 근무확인', id:'223026380112', dt:'2023-02-25'},
 {n:'지출결의서', d:'회사 돈을 쓰기 전에 승인받고 기록을 남길 때 쓰는 내부 문서예요.', c:'회계·내부 문서', f:'한글', s:'지출결의서 지출품의서 품의서 결의서 경비', id:'223024249788', dt:'2023-02-23'},
 {n:'대표자 이력서', d:'대출·입찰·인증 신청에서 대표자 이력을 내야 할 때 쓰는 양식이에요.', c:'세무·제출 서류', f:'한글', s:'이력서 대표 이력 입찰 인증 대출서류', id:'223023970327', dt:'2023-02-22'},
 {n:'해촉증명서', d:'프리랜서 계약이 끝났을 때 건강보험료를 조정하려고 내는 소득 증빙이에요.', c:'세무·제출 서류', f:'한글', s:'해촉증명서 해촉 위촉해제 프리랜서 건강보험료 건보료 조정', id:'223022890977', dt:'2023-02-21'}
];
/*FORMS_END*/
const POP = ['근로계약서','차용증','견적서','프리랜서','재직증명서','위임장'];
const CATS = ['전체','법인·주식','인사·노무','가족·상속·증여','세무·제출 서류','회계·내부 문서'];
const $=id=>document.getElementById(id);
let cat='전체';
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function hl(text,q){ if(!q) return esc(text); const t=esc(text); const i=norm(text).indexOf(norm(q)); if(i<0) return t;
  // 공백 무시 매칭 위치를 원문 인덱스로 바꾸기
  let k=0, st=-1, en=-1; for(let j=0;j<text.length;j++){ if(/\s/.test(text[j])) continue; if(k===i) st=j; k++; if(k===i+norm(q).length){ en=j+1; break; } }
  if(st<0||en<0) return t; return esc(text.slice(0,st))+'<mark>'+esc(text.slice(st,en))+'</mark>'+esc(text.slice(en)); }
function render(){
  const q=$('q').value.trim(); $('clr').style.display=q?'block':'none';
  const nq=norm(q);
  const now=Date.now();
  let list=FORMS.filter(f=>(cat==='전체'||f.c===cat) && (!nq || norm(f.n+f.s+f.d+f.c).includes(nq)));
  if(nq) list.sort((a,b)=>(norm(b.n).includes(nq)-norm(a.n).includes(nq)));
  $('count').textContent = q ? `'${q}' 검색 결과 ${list.length}개` : `양식 ${list.length}개`;
  if(!list.length){ $('list').innerHTML=`<div class="none">'${esc(q)}' 양식은 아직 없어요.<br>아래 <b>카톡으로 양식 요청하기</b>로 알려 주시면 만들어 드릴게요.</div>`; return; }
  $('list').innerHTML=list.map(f=>{ const url=f.url||('https://blog.naver.com/form88896/'+f.id); const isNew=(now-new Date(f.dt).getTime())<1000*60*60*24*30;
    return `<a class="item" href="${url}" target="_blank" rel="noopener"><div class="h"><b>${hl(f.n,q)}${isNew?'<span class="new">NEW</span>':''}</b><span class="ft ${f.f==='워드'?'w':'h'}">${f.f}</span></div><p>${esc(f.d)}</p><div class="m"><span class="c">${f.c}</span><span class="go">블로그에서 받기 →</span></div></a>`; }).join('');
}
POP.forEach(p=>{ const b=document.createElement('button'); b.textContent=p; b.onclick=()=>{ $('q').value=p; cat='전체'; drawCats(); render(); }; $('pop').appendChild(b); });
function drawCats(){ $('cats').innerHTML=''; CATS.forEach(c=>{ const b=document.createElement('button'); b.textContent=c; if(c===cat) b.className='on'; b.onclick=()=>{ cat=c; drawCats(); render(); }; $('cats').appendChild(b); }); }
$('q').addEventListener('input',render);
$('clr').onclick=()=>{ $('q').value=''; render(); $('q').focus(); };
const qp=new URLSearchParams(location.search).get('q'); if(qp) $('q').value=qp;
drawCats(); render();
</script>
